# Veröffentlicht die Landingpage aus site/ auf GitHub Pages (liegt im öffentlichen Repository jagd-app-release und wird
# vom Workflow oeffentlich.yml des privaten Repositories dorthin kopiert; hier nicht von Hand ändern).
# Einmalig in den Repo-Einstellungen: Pages → Source „GitHub Actions“.
name: Landingpage

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
